name: KSU Integration

on:
  workflow_dispatch:
  

jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: 4.14.200-p
        fetch-depth: 0

    - name: Configure Git identity
      run: |
        git config --local user.name "Aflahal"
        git config --local user.email "zxx97607@gmail.com"

    - name: Run ReSukiSU Setup
      run: |
        git rm -rf KernelSU || true
        rm -rf KernelSU .git/modules/KernelSU
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

    - name: Commit and Push
      run: |
        git add -A
        if git diff --cached --quiet; then
          echo "No changes detected."
        else
          git commit -m "kernel: update ReSukiSU source"
          git push origin 4.14.200
        fi
        
